<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Girişi - NFC & Yüz Tanıma</title>
    <!-- Stil (CSS) dosyamızı bağlıyoruz -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    
    <div class="login-container glass-effect">
        <div class="login-header">
            <div class="lock-icon">🔒</div>
            <h2>GÜVENLİK PANELİ</h2>
            <p>Sisteme erişmek için şifrenizi girin.</p>
        </div>

        <!-- Hata mesajı varsa kırmızı renkte gösterecek -->
        {% if hata %}
            <div class="error-msg">{{ hata }}</div>
        {% endif %}

        <form action="/" method="POST">
            <div class="input-group">
                <!-- type="password" sayesinde yazdığınız şifre noktalı (gizli) görünür -->
                <input type="password" name="sifre" placeholder="Şifrenizi Girin..." required>
            </div>
            <button type="submit" class="glow-on-hover">SİSTEME GİRİŞ YAP</button>
        </form>
    </div>

</body>
</html>
