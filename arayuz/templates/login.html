<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş & Kiosk Sistemi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #000; color: white; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .kiosk-container { width: 600px; padding: 40px; background: rgba(255,255,255,0.05); border-radius: 15px; text-align: center; position: relative; }
        
        .login-input { width: 80%; padding: 15px; margin: 15px 0; background: #111; border: 1px solid #0f0; color: #0f0; font-size: 1.2em; text-align: center; border-radius: 8px; }
        #sifre_formu, #uzaktan_giris_formu { display: none; }
        #nfc_animasyon { margin: 20px 0; font-size: 3em; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } 100% { opacity: 0.5; transform: scale(0.95); } }
        
        .uzaktan-btn { position: absolute; bottom: 10px; right: 10px; background: none; border: none; color: #555; cursor: pointer; font-size: 0.8em; text-decoration: underline; }
        .uzaktan-btn:hover { color: #0ff; }
    </style>
</head>
<body>

    <div class="kiosk-container glass-effect">
        <h2 style="color: #0ff; margin-bottom: 20px;">🛡️ GÜVENLİ GEÇİŞ SİSTEMİ</h2>
        
        <!-- 1. NFC BEKLEME EKRANI (SENİN KODUN) -->
        <div id="kart_bekleme_ekrani">
            <div id="nfc_animasyon">📡</div>
            <p style="color: #0f0; font-weight: bold; font-size: 1.2em; margin-bottom: 20px;" id="nfc_durum">
                📡 Lütfen Kapıdaki Okuyucuya Kartınızı Okutun...
            </p>
        </div>

        <!-- 2. ARAYÜZ VE KAMERA (BİREBİR SENİN KODLARIN) -->
        <div id="islem_sonucu" style="margin-top: 25px; padding: 15px; border-radius: 8px; display: none; font-size: 1.1em;"></div>

        <div id="kamera_alani" style="margin-top: 25px; display: none;">
            <p id="canlilik_uyari" style="color: #ffaa00; margin-bottom: 10px; font-weight: bold; font-size: 1.1em;">
                🤖 Robot olmadığınızı kanıtlamak için lütfen GÖZ KIRPIN!
            </p>
            <div style="position: relative; width: 320px; height: 240px; margin: 0 auto; border: 3px solid #0ff; border-radius: 10px; overflow: hidden; box-shadow: 0 0 15px #0ff;">
                <video id="videoStream" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);"></video>
                <div id="yuz_cercevesi" style="position: absolute; top: 10%; left: 25%; width: 50%; height: 80%; border: 2px dashed rgba(0, 255, 0, 0.7); border-radius: 50%; box-shadow: 0 0 0 9999px rgba(0,0,0,0.6); transition: 0.3s;">
                </div>
            </div>
            <p id="deneme_uyarisi" style="color: #0f0; font-weight: bold; margin-top: 10px;"></p>
            <button id="btn_yuzu_tara" disabled style="margin-top: 15px; padding: 12px 30px; background: #555; color: #aaa; font-weight: bold; font-size: 1.2em; border: none; border-radius: 5px; cursor: not-allowed; transition: 0.3s;">❌
                Göz Kırpması Bekleniyor...</button>
            <canvas id="canvasFrame" style="display: none;"></canvas>
        </div>

        <div id="foto_alani" style="margin-top: 15px; display: none;">
            <p style="color: #0f0; font-weight: bold; margin-bottom: 5px;">İşlem Sonucu:</p>
            <img id="sonuc_resmi" src="" style="max-width: 320px; border: 3px solid #0f0; border-radius: 10px;">
        </div>
        <!-- SENİN KODLARININ BİTİŞİ -->

        <!-- 3. YÖNETİCİ ŞİFRE EKRANI -->
        <form method="POST" id="sifre_formu" action="/">
            <h4 style="color: #0f0; margin-bottom: 15px;">✅ Yönetici Doğrulandı!</h4>
            <p style="color: #aaa; font-size: 0.9em;">Kapınız açıldı. Panele girmek için şifrenizi girin.</p>
            <input type="password" name="sifre" class="login-input" placeholder="Sistem Şifresi" required>
            <button type="submit" class="login-input" style="background: #0f0; color: #000; cursor: pointer; font-weight: bold;">PANELE GİRİŞ YAP</button>
            <button type="button" class="login-input" onclick="resetArayuz()" style="background: #444; color: #fff; cursor: pointer; border-color: #444;">Sadece Geçiş Yap (İptal)</button>
        </form>

        <!-- 4. UZAKTAN 2FA GİRİŞ EKRANI -->
        <div id="uzaktan_giris_formu">
            <h4 style="color: #0ff;">💻 Uzaktan Yönetici Girişi</h4>
            <div id="adim1_sifre">
                <input type="password" id="uzaktan_sifre" class="login-input" placeholder="Sistem Şifresi">
                <button type="button" onclick="kodGonder()" class="login-input" style="background: #0ff; color: #000; cursor: pointer;">Telegram Kodu Gönder</button>
            </div>
            <div id="adim2_kod" style="display: none;">
                <p style="color: #0f0;">Telegram'a gelen 6 haneli kodu girin.</p>
                <input type="text" id="uzaktan_kod" class="login-input" placeholder="Onay Kodu">
                <button type="button" onclick="kodDogrula()" class="login-input" style="background: #0f0; color: #000; cursor: pointer;">Giriş Yap</button>
            </div>
            <button type="button" onclick="resetArayuz()" style="background: none; border: none; color: #aaa; cursor: pointer; text-decoration: underline; margin-top: 10px;">Vazgeç</button>
        </div>

        <button class="uzaktan-btn" onclick="uzaktanGirisGoster()">Uzaktan Giriş</button>
    </div>

    <script>
        // KULLANICININ ORİJİNAL JAVASCRIPT KODLARI
        let aktifUid = "";
        let aktifRol = ""; 
        
        const sse = new EventSource('/api/bekleyen_kart_stream');
        sse.onmessage = function (event) {
            const gelen_uid = event.data.trim();
            if (gelen_uid && document.getElementById('kart_bekleme_ekrani').style.display !== "none") {
                document.getElementById('nfc_durum').innerHTML = "✅ Kart Okundu! Kimlik Doğrulanıyor...";
                document.getElementById('nfc_durum').style.color = "#0ff";
                kartKontrol(gelen_uid);
            }
        };

        let kalanDeneme = 3;
        let videoStream = null;

        let faceMesh = null;
        let mpCamera = null;
        let canliMi = false;
        let gozKapali = false;
        let yuzHizalandi = false;
        let onAnalizBasladi = false;

        function hesaplaEAR(goz) {
            const dikey1 = Math.hypot(goz[1].x - goz[5].x, goz[1].y - goz[5].y);
            const dikey2 = Math.hypot(goz[2].x - goz[4].x, goz[2].y - goz[4].y);
            const yatay = Math.hypot(goz[0].x - goz[3].x, goz[0].y - goz[3].y);
            return (dikey1 + dikey2) / (2.0 * yatay);
        }

        function initFaceMesh() {
            if (faceMesh) return;
            faceMesh = new FaceMesh({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
                }
            });
            faceMesh.setOptions({
                maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
            });
            faceMesh.onResults(onResults);
        }

        function onResults(results) {
            if (canliMi) return;
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                
                if (!yuzHizalandi) {
                    const xNoktalari = landmarks.map(p => p.x);
                    const yNoktalari = landmarks.map(p => p.y);
                    const minX = Math.min(...xNoktalari);
                    const maxX = Math.max(...xNoktalari);
                    const minY = Math.min(...yNoktalari);
                    const maxY = Math.max(...yNoktalari);
                    
                    if (minX > 0.25 && maxX < 0.75 && minY > 0.12 && Math.abs(maxY - minY) > 0.50) {
                        yuzHizalandi = true;
                        document.getElementById('yuz_cercevesi').style.borderColor = "#0ff"; 
                        document.getElementById('canlilik_uyari').innerHTML = "✅ Yüz Hizalandı. Şimdi Lütfen GÖZ KIRPIN!";
                        document.getElementById('canlilik_uyari').style.color = "#0ff";
                        
                        onAnalizGonder();
                    } else {
                        document.getElementById('canlilik_uyari').innerHTML = "⚠️ Lütfen yüzünüzü tam olarak oval çerçeveye oturtun!";
                        document.getElementById('canlilik_uyari').style.color = "#ffaa00";
                        return; 
                    }
                }
                
                const solGoz = [landmarks[33], landmarks[160], landmarks[158], landmarks[133], landmarks[153], landmarks[144]];
                const sagGoz = [landmarks[362], landmarks[385], landmarks[387], landmarks[263], landmarks[373], landmarks[380]];

                const solEAR = hesaplaEAR(solGoz);
                const sagEAR = hesaplaEAR(sagGoz);
                const ortalamaEAR = (solEAR + sagEAR) / 2;

                if (ortalamaEAR < 0.22) {
                    gozKapali = true;
                } else if (gozKapali && ortalamaEAR > 0.25) {
                    canliMi = true;
                    
                    const btn = document.getElementById('btn_yuzu_tara');
                    btn.innerHTML = "✅ Canlılık Onaylandı!";
                    btn.style.background = "#0f0";
                    btn.style.color = "#000";

                    sonucuSorgula(); 
                }
            }
        }

        function kartKontrol(uid) {
            const sonucDiv = document.getElementById('islem_sonucu');
            const kameraAlani = document.getElementById('kamera_alani');
            const fotoAlani = document.getElementById('foto_alani');

            aktifUid = uid; kalanDeneme = 3;
            fotoAlani.style.display = "none";
            kameraAlani.style.display = "none";
            kapatKamera();

            sonucDiv.style.display = "block";
            sonucDiv.innerHTML = "⏳ Kart veritabanında aranıyor...";
            sonucDiv.style.border = "1px solid #ffaa00";
            sonucDiv.style.color = "#ffaa00";

            fetch('/api/kart_kontrol', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ uid: uid })
            })
                .then(response => response.json())
                .then(data => {
                    sonucDiv.textContent = data.mesaj;
                    if (data.durum === "BASARILI") {
                        aktifRol = data.rol; // Kiosk için Rolü Kaydet
                        sonucDiv.style.border = "2px solid #0ff";
                        sonucDiv.style.color = "#0ff";
                        kameraBaslat();
                    } else {
                        sonucDiv.style.border = "2px solid #f00";
                        sonucDiv.style.color = "#f00";
                        setTimeout(resetArayuz, 3000);
                    }
                });
        }

        function kameraBaslat() {
            const video = document.getElementById('videoStream');
            const kameraAlani = document.getElementById('kamera_alani');
            const uyari = document.getElementById('deneme_uyarisi');

            canliMi = false;
            gozKapali = false;
            yuzHizalandi = false;
            onAnalizBasladi = false;
            const btn = document.getElementById('btn_yuzu_tara');
            btn.disabled = true;
            btn.innerHTML = "❌ Göz Kırpması Bekleniyor...";
            btn.style.background = "#555";
            btn.style.color = "#aaa";
            btn.style.cursor = "not-allowed";
            btn.style.boxShadow = "none";
            document.getElementById('canlilik_uyari').innerHTML = "🤖 Robot olmadığınızı kanıtlamak için lütfen GÖZ KIRPIN!";
            document.getElementById('canlilik_uyari').style.color = "#ffaa00";
            document.getElementById('yuz_cercevesi').style.borderColor = "rgba(0, 255, 0, 0.7)";

            uyari.innerHTML = `Kalan Deneme Hakkı: ${kalanDeneme}`;
            uyari.style.color = "#0f0";

            initFaceMesh();

            navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
                .then(stream => {
                    videoStream = stream;
                    video.srcObject = stream;
                    kameraAlani.style.display = "block";
                    document.getElementById('islem_sonucu').style.display = "none";

                    if (mpCamera) { mpCamera.stop(); }
                    mpCamera = new Camera(video, {
                        onFrame: async () => { await faceMesh.send({ image: video }); },
                        width: 640, height: 480
                    });
                    mpCamera.start();
                })
                .catch(err => {
                    console.error("Kamera hatası:", err);
                    alert("Kameraya erişilemedi!");
                });
        }

        function onAnalizGonder() {
            if (onAnalizBasladi) return;
            onAnalizBasladi = true;
            
            const video = document.getElementById('videoStream');
            const canvas = document.getElementById('canvasFrame');
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            
            fetch('/api/on_analiz_baslat', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ uid: aktifUid, image: dataUrl })
            });
        }

        function sonucuSorgula() {
            const btn = document.getElementById('btn_yuzu_tara');
            btn.innerHTML = "⏳ Arka Plan Analizi Bekleniyor...";
            
            fetch('/api/yuz_kontrol', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ uid: aktifUid })
            })
            .then(response => response.json())
            .then(data => {
                const sonucDiv = document.getElementById('islem_sonucu');
                sonucDiv.style.display = "block";
                
                if (data.durum === "BASARILI") {
                    sonucDiv.textContent = "✅ " + data.mesaj;
                    sonucDiv.style.border = "2px solid #0f0";
                    sonucDiv.style.color = "#0f0";
                    kapatKamera();
                    gosterSonuc(data.foto, "#0f0");
                } else {
                    kalanDeneme--;
                    const uyari = document.getElementById('deneme_uyarisi');

                    if (kalanDeneme > 0) {
                        sonucDiv.textContent = "❌ " + data.mesaj;
                        sonucDiv.style.border = "2px solid #ffaa00";
                        sonucDiv.style.color = "#ffaa00";

                        canliMi = false;
                        gozKapali = false;
                        yuzHizalandi = false;
                        onAnalizBasladi = false;

                        btn.disabled = true;
                        btn.innerHTML = "❌ Lütfen Yüzünüzü Tekrar Hizalayın...";
                        btn.style.background = "#555";
                        btn.style.color = "#aaa";
                        document.getElementById('yuz_cercevesi').style.borderColor = "rgba(0, 255, 0, 0.7)";

                        uyari.innerHTML = `Kalan Deneme Hakkı: ${kalanDeneme}`;
                        uyari.style.color = "#ffaa00";
                    } else {
                        kapatKamera();
                        blokeEt(null);
                    }
                }
            });
        }

        function gosterSonuc(fotoB64, renk) {
            if (!fotoB64) return;
            const fotoAlani = document.getElementById('foto_alani');
            const sonucResmi = document.getElementById('sonuc_resmi');

            sonucResmi.src = "data:image/jpeg;base64," + fotoB64;
            sonucResmi.style.borderColor = renk;
            sonucResmi.style.boxShadow = `0 0 15px ${renk}`;
            fotoAlani.style.display = "block";
            
            // YÖNETİCİ Mİ KONTROLÜ (Sadece Kiosk için)
            if (aktifRol === 'YÖNETİCİ' || aktifRol === 'YONETICI') {
                document.getElementById('sifre_formu').style.display = "block";
                setTimeout(resetArayuz, 15000); 
            } else {
                setTimeout(resetArayuz, 5000);
            }
        }

        function blokeEt(fotoB64) {
            const sonucDiv = document.getElementById('islem_sonucu');
            sonucDiv.textContent = "🚨 3 hatalı deneme tespit edildi! Kart bloke ediliyor...";
            sonucDiv.style.border = "2px solid #f00";
            sonucDiv.style.color = "#f00";

            fetch('/api/kart_bloke_et', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ uid: aktifUid, image: fotoB64 })
            })
                .then(response => response.json())
                .then(data => {
                    sonucDiv.textContent = `❌ ${data.mesaj}`;
                });
            setTimeout(resetArayuz, 5000);
        }

        function kapatKamera() {
            document.getElementById('kamera_alani').style.display = "none";
            if (mpCamera) { mpCamera.stop(); }
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }

        function resetArayuz() {
            kapatKamera();
            aktifUid = "";
            document.getElementById('nfc_durum').innerHTML = "📡 Lütfen Kapıdaki Okuyucuya Kartınızı Okutun...";
            document.getElementById('nfc_durum').style.color = "#0f0";
            document.getElementById('islem_sonucu').style.display = "none";
            document.getElementById('foto_alani').style.display = "none";
            document.getElementById('kart_bekleme_ekrani').style.display = "block";
            document.getElementById('sifre_formu').style.display = "none";
            document.getElementById('uzaktan_giris_formu').style.display = "none";
        }

        // --- UZAKTAN 2FA İŞLEMLERİ ---
        function uzaktanGirisGoster() {
            resetArayuz();
            document.getElementById('kart_bekleme_ekrani').style.display = "none";
            document.getElementById('uzaktan_giris_formu').style.display = "block";
        }

        function kodGonder() {
            const sifre = document.getElementById('uzaktan_sifre').value;
            fetch('/api/uzaktan_giris_kod_gonder', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({sifre: sifre})
            }).then(res => res.json()).then(data => {
                if (data.durum === "BASARILI") {
                    document.getElementById('adim1_sifre').style.display = "none";
                    document.getElementById('adim2_kod').style.display = "block";
                } else {
                    alert(data.mesaj);
                }
            });
        }

        function kodDogrula() {
            const kod = document.getElementById('uzaktan_kod').value;
            fetch('/api/uzaktan_giris_dogrula', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({kod: kod})
            }).then(res => res.json()).then(data => {
                if (data.durum === "BASARILI") {
                    window.location.href = data.url;
                } else {
                    alert(data.mesaj);
                }
            });
        }
        
         let sayfaDegisiyor = false; // Yönlendirme (Sayfa geçişi) kontrolcüsü
        // 1. Sen sekmeyi kapattığın veya sayfa değiştirdiğin an tetiklenir
        window.addEventListener('beforeunload', function () {
            sayfaDegisiyor = true; // Sayfa değiştiğini işaretle
            navigator.sendBeacon('/api/sekme_kapandi'); // Sunucuya haber ver
        });
        // 2. Sunucu kapanırsa (CTRL+C) tetiklenen açık hat
        const evtSource = new EventSource("/api/sunucu_durumu");
        evtSource.onerror = function() {
            // SADECE sayfa değiştirilmiyorsa (Gerçekten sunucu çökmüşse) sekmeyi kapat!
            if (!sayfaDegisiyor) {
                evtSource.close();
                document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20%; font-family:sans-serif;'>Sunucu Kapatıldı!<br>Bağlantı Koptu.</h1>";
                window.open('', '_self', ''); 
                window.close();
            }
        };
                // 1. Sen sekmeyi kapattığın veya sayfa değiştirdiğin an tetiklenir
        window.addEventListener('beforeunload', function () {
            sayfaDegisiyor = true; 
            
            // GÜÇLENDİRME: Sistemdeki tüm açık hatları ve kameraları zorla temizle!
            if (typeof evtSource !== 'undefined') { evtSource.close(); }
            if (typeof sse !== 'undefined') { sse.close(); } // NFC Dinleyicisini de Kapat!
            
            // Kameraların donanımını serbest bırak
            const kamera1 = document.getElementById("canli_kamera_alani");
            if (kamera1) kamera1.src = ""; 
            const kamera2 = document.getElementById("videoStreamKayit");
            if (kamera2 && kamera2.srcObject) {
                kamera2.srcObject.getTracks().forEach(track => track.stop());
                kamera2.srcObject = null;
            }
            
            navigator.sendBeacon('/api/sekme_kapandi'); 
        });

    </script>
</body>
</html>
