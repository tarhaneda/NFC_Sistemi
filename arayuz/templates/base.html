<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Güvenlik Sistemi{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body class="dashboard-body">

    <!-- Üst Menü (Tüm Sayfalar Buradan Beslenecek) -->
    <nav class="top-nav glass-effect">
        <div class="nav-logo">🛡️ NFC & YÜZ TANIMA SİSTEMİ</div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}" class="{% if active_page == 'dashboard' %}active{% endif %}">Ana Panel</a>
            <a href="{{ url_for('kullanici_yonetimi') }}" class="{% if active_page == 'kullanici_yonetimi' %}active{% endif %}">Kullanıcı Yönetimi</a>
            <a href="{{ url_for('loglar') }}" class="{% if active_page == 'loglar' %}active{% endif %}">Sistem Logları</a>
            <a href="{{ url_for('kisi_loglari') }}" class="{% if active_page == 'kisi_loglari' %}active{% endif %}">Kişi Logları</a>
            <a href="{{ url_for('logout') }}" style="color: #ff4444; margin-left: 15px;">Çıkış Yap</a>
        </div>
    </nav>

    <!-- Diğer sayfaların kendi özel içerikleri buraya gömülecek -->
    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
   <!-- YENİ: GERÇEK ZAMANLI BİLDİRİM AJANI -->
<script>
    let sonBildirimID = 0; 
    
    // Her 3 saniyede bir sessizce (sayfa yenilemeden) arka plana sor
    setInterval(() => {
        fetch('/api/canli_bildirim')
        .then(res => res.json())
        .then(data => {
            // İlk açılış değilse ve YENİ bir olay olduysa
            if (sonBildirimID !== 0 && data.id > sonBildirimID) {
                
                // Sağ altta şık bir bildirim balonu çıkar
                const toast = document.createElement("div");
                toast.innerHTML = data.mesaj;
                toast.style.cssText = "position:fixed; bottom:20px; right:20px; background:#0f0; color:#000; padding:15px 25px; border-radius:10px; font-weight:bold; box-shadow:0 0 15px #0f0; z-index:9999; animation: slideIn 0.5s;";
                document.body.appendChild(toast);
                
                // 4 Saniye sonra bildirimi sil
                setTimeout(() => { toast.remove(); }, 4000);

                // SADECE "loglar" geçen sayfalardaysak, 1.5 saniye sonra tabloyu yenile!
                if (window.location.pathname.includes("loglar")) {
                    setTimeout(() => { window.location.reload(); }, 1500); 
                }
            }
            sonBildirimID = data.id; // Hafızayı güncelle
        })
        .catch(err => console.log("Canlı bildirim bekleniyor..."));
    }, 3000);
</script>
<style>
    @keyframes slideIn { from { right: -300px; opacity: 0; } to { right: 20px; opacity: 1; } }
</style>


</body>
</html>
